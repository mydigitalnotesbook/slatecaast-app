name: Build APK From Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -o slatecast.zip
          # Debug config लाइन हटाना ताकि बिल्ड न रुके
          sed -i '/signingConfigs.getByName("debugConfig")/d' app/build.gradle.kts
          # मिसिंग gradlew फ़ाइल बनाना
          gradle wrapper
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Slatecaast-APK
          path: app/build/outputs/apk/debug/*.apk
          
